name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: skills/accesibilidad-web/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  panel:
    # El panel debe seguir sin dependencias: basta con Node para comprobar su sintaxis.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check skills/accesibilidad-web/panel/panel-accesibilidad.js
      - name: Sin peticiones de red ni rastreo
        run: |
          if grep -nE "fetch\(|XMLHttpRequest|sendBeacon|WebSocket|document\.cookie" skills/accesibilidad-web/panel/panel-accesibilidad.js; then
            exit 1
          fi
