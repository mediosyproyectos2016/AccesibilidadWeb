name: Normativa
description: Corrección o actualización legal o normativa (Ley 11/2023, RD 1112/2018, EN 301 549, WCAG).
labels: [normativa]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué hay que corregir o actualizar
    validations:
      required: true
  - type: input
    id: fuente
    attributes:
      label: Fuente oficial
      description: BOE, DOUE, ETSI, W3C, observatorio…
      placeholder: https://www.boe.es/...
    validations:
      required: true
